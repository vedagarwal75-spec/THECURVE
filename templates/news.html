{% extends "base.html" %}
{% block title %}News{% endblock %}

{% block head %}
<style>
  .news-card { transition: border-color .25s, background-color .25s, transform .25s; }
  .news-card:hover { border-color: rgba(255,255,255,.15); background: rgba(255,255,255,.04); transform: translateY(-2px); }
  .tag { font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.09em; text-transform:uppercase; padding:3px 7px; border-radius:5px; }
  .tag-bullish { background:rgba(107,191,138,.11); color:#6BBF8A; }
  .tag-bearish { background:rgba(217,112,95,.11);  color:#D9705F; }
  .tag-neutral { background:rgba(255,255,255,.055); color:#7C8794; }
  .filter { font-size:12px; padding:6px 12px; border-radius:8px; color:#7C8794; transition:color .2s, background-color .2s; }
  .filter:hover { color:#AEB7C2; }
  .filter.on { background:rgba(255,255,255,.07); color:#ECEAE6; }
  .clamp-3 { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .clamp-3l { display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .shimmer { background:linear-gradient(90deg, rgba(255,255,255,.035) 25%, rgba(255,255,255,.07) 50%, rgba(255,255,255,.035) 75%); background-size:200% 100%; animation:sh 1.6s infinite; border-radius:5px; }
  @keyframes sh { 0%{ background-position:200% 0 } 100%{ background-position:-200% 0 } }
</style>
{% endblock %}

{% block content %}

<div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4 mb-7">
  <div>
    <h1 class="font-display text-[34px] leading-tight tracking-[-.02em] text-paper">News</h1>
    <p class="text-[14px] text-paper-mute mt-1.5">Macro headlines, read for tone.</p>
  </div>
  <div class="flex items-center gap-2">
    <div class="flex items-center gap-0.5 card !rounded-lg p-1">
      <button class="filter" data-filter="all">All</button>
      <button class="filter" data-filter="Bullish">Bullish</button>
      <button class="filter" data-filter="Bearish">Bearish</button>
      <button class="filter" data-filter="Neutral">Neutral</button>
    </div>
    <button id="refreshBtn" class="w-9 h-9 flex items-center justify-center rounded-lg border border-white/[.09] text-paper-mute hover:text-gold hover:border-gold/35 transition-colors" aria-label="Refresh">
      <svg id="refreshIcon" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.6m15.4 2A8 8 0 004.6 9m0 0H9m11 11v-5h-.6m0 0a8 8 0 01-15.4-2m15.4 2H15"/></svg>
    </button>
  </div>
</div>

<div class="flex items-center justify-between gap-4 mb-5 pb-4 border-b border-white/[.07]">
  <div class="flex items-center gap-2.5 min-w-0">
    <span id="statusDot" class="w-1.5 h-1.5 rounded-full bg-up shrink-0"></span>
    <span class="text-[12.5px] text-paper-mute truncate" id="statusText">Loading…</span>
  </div>
  <div class="flex items-center gap-3.5 shrink-0">
    <span class="text-[11.5px] num text-up" id="bullishCount">0</span>
    <span class="text-[11.5px] num text-down" id="bearishCount">0</span>
    <span class="text-[11.5px] num text-paper-mute" id="neutralCount">0</span>
  </div>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3.5" id="newsGrid">
  {% for i in range(6) %}
  <div class="card p-5">
    <div class="shimmer h-3 w-14 mb-4"></div>
    <div class="shimmer h-3.5 w-full mb-2"></div>
    <div class="shimmer h-3.5 w-4/5 mb-5"></div>
    <div class="shimmer h-2.5 w-full mb-2"></div>
    <div class="shimmer h-2.5 w-3/5"></div>
  </div>
  {% endfor %}
</div>

{% endblock %}

{% block scripts %}
<script>
  var allArticles = [], currentFilter = 'all';

  function escapeHtml(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  }
  // Only http(s) links are ever rendered as clickable.
  function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? u : ''; }

  function renderCards(articles) {
    var grid = document.getElementById('newsGrid');

    if (!articles.length) {
      grid.innerHTML =
        '<div class="col-span-full py-20 text-center">' +
          '<p class="font-display text-[19px] text-paper-dim">Nothing in this category</p>' +
          '<p class="text-[13px] text-paper-mute mt-1.5">Try a different filter.</p>' +
        '</div>';
      return;
    }

    grid.innerHTML = articles.map(function (a, i) {
      var s = a.sentiment || 'Neutral';
      var url = safeUrl(a.url);
      return '' +
      '<article class="card news-card p-5 flex flex-col gap-3 rise" style="animation-delay:' + ((i % 6) * 0.05) + 's">' +
        '<div class="flex items-center justify-between gap-2">' +
          '<span class="tag tag-' + s.toLowerCase() + '">' + s + '</span>' +
          '<span class="text-[11px] text-paper-faint truncate max-w-[55%]">' + escapeHtml(a.source) + '</span>' +
        '</div>' +
        '<h3 class="text-[14.5px] font-semibold text-paper leading-snug clamp-3">' + escapeHtml(a.title) + '</h3>' +
        '<p class="text-[12.5px] text-paper-mute leading-relaxed flex-1 clamp-3l">' + escapeHtml(a.summary) + '</p>' +
        (url
          ? '<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-[12px] text-gold hover:text-gold-soft transition-colors mt-auto pt-1">' +
              'Read article' +
              '<svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25"/></svg>' +
            '</a>'
          : '<span class="text-[11.5px] text-paper-faint mt-auto pt-1">Sample headline</span>') +
      '</article>';
    }).join('');
  }

  function applyFilter(f) {
    currentFilter = f;
    renderCards(f === 'all' ? allArticles : allArticles.filter(function (a) { return a.sentiment === f; }));
  }

  function updateCounts(list) {
    var c = function (s) { return list.filter(function (a) { return a.sentiment === s; }).length; };
    document.getElementById('bullishCount').textContent = c('Bullish') + ' bullish';
    document.getElementById('bearishCount').textContent = c('Bearish') + ' bearish';
    document.getElementById('neutralCount').textContent = c('Neutral') + ' neutral';
  }

  function setActive(btn) {
    document.querySelectorAll('.filter').forEach(function (b) { b.classList.remove('on'); });
    btn.classList.add('on');
  }

  async function fetchNews() {
    var btn = document.getElementById('refreshBtn'),
        icon = document.getElementById('refreshIcon'),
        statusText = document.getElementById('statusText'),
        dot = document.getElementById('statusDot');

    btn.disabled = true;
    icon.classList.add('animate-spin');

    try {
      var res = await fetch('/api/news');
      if (!res.ok) throw new Error('status ' + res.status);
      var data = await res.json();

      // Accepts both the {articles, source} shape and a bare array.
      var articles = Array.isArray(data) ? data : (data.articles || []);
      var source = Array.isArray(data) ? 'live' : (data.source || 'live');
      allArticles = articles;

      applyFilter(currentFilter);
      updateCounts(allArticles);

      var time = new Date().toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
      if (source === 'sample') {
        dot.className = 'w-1.5 h-1.5 rounded-full bg-gold shrink-0';
        statusText.innerHTML = '<span class="text-gold">Sample headlines</span> — the live feed is unavailable right now';
      } else {
        dot.className = 'w-1.5 h-1.5 rounded-full bg-up shrink-0';
        statusText.textContent = allArticles.length + ' headlines · updated ' + time;
      }
    } catch (err) {
      dot.className = 'w-1.5 h-1.5 rounded-full bg-paper-faint shrink-0';
      statusText.textContent = 'Feed unavailable';
      document.getElementById('newsGrid').innerHTML =
        '<div class="col-span-full py-20 text-center">' +
          '<p class="font-display text-[20px] text-paper">The news feed is quiet</p>' +
          '<p class="text-[13px] text-paper-mute mt-2 max-w-sm mx-auto leading-relaxed">Couldn\'t load headlines just now. The rest of the site is unaffected.</p>' +
          '<button id="newsRetry" class="mt-5 px-4 py-2 rounded-lg border border-white/[.12] text-[12.5px] text-paper-dim hover:border-gold/40 hover:text-gold transition-colors">Try again</button>' +
        '</div>';
      var r = document.getElementById('newsRetry');
      if (r) r.addEventListener('click', fetchNews);
      if (window.console) console.warn('News fetch failed:', err);
    } finally {
      btn.disabled = false;
      icon.classList.remove('animate-spin');
    }
  }

  document.querySelectorAll('.filter').forEach(function (b) {
    b.addEventListener('click', function () { setActive(this); applyFilter(this.dataset.filter); });
  });
  document.getElementById('refreshBtn').addEventListener('click', fetchNews);

  setActive(document.querySelector('.filter[data-filter="all"]'));
  window.addEventListener('load', fetchNews);
</script>
{% endblock %}
